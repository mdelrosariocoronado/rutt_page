<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Fondo redondeado suave (Podés quitarlo si lo querés 100% transparente) -->
  <rect width="100%" height="100%" rx="20" fill="#F8F9FA"/>
  
  <g transform="translate(15, 15)">
    <!-- Conexiones principales formando una 'R' abstracta -->
    <path d="M20 50 L45 20 L70 20 L45 50 L70 80" fill="none" stroke="#007BFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20 20 L20 80" fill="none" stroke="#FFA500" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Nodos brillantes -->
    <circle cx="20" cy="20" r="7" fill="#FFA500" />
    <circle cx="20" cy="50" r="5" fill="#FFA500" />
    <circle cx="20" cy="80" r="7" fill="#FFA500" />
    <circle cx="45" cy="20" r="7" fill="#007BFF" />
    <circle cx="70" cy="20" r="7" fill="#007BFF" />
    <circle cx="45" cy="50" r="6" fill="#007BFF" />
    
    <!-- Nodo meta (Trabajo/Empresa) -->
    <circle cx="70" cy="80" r="9" fill="#28A745" />
  </g>
</svg>
